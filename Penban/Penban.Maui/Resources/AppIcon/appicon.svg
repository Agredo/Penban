<svg width="456" height="456" viewBox="0 0 456 456" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <!-- board -->
  <rect x="0" y="0" width="456" height="456" rx="72" fill="#4F46E5"/>
  <!-- soft inner shade -->
  <rect x="0" y="0" width="456" height="456" rx="72" fill="#1A17C9" opacity="0.18"/>
  <!-- back note, tilted left -->
  <g transform="rotate(-9 214 232)">
    <rect x="112" y="130" width="204" height="204" rx="10" fill="#CBE2FF"/>
    <rect x="112" y="130" width="204" height="204" rx="10" fill="#000000" opacity="0.06"/>
  </g>
  <!-- middle note, tilted right -->
  <g transform="rotate(7 244 244)">
    <rect x="152" y="152" width="204" height="204" rx="10" fill="#FFD6E8"/>
    <rect x="152" y="152" width="204" height="204" rx="10" fill="#000000" opacity="0.04"/>
  </g>
  <!-- front note -->
  <g transform="rotate(-2 228 228)">
    <rect x="124" y="124" width="208" height="208" rx="10" fill="#FCF29B"/>
    <rect x="124" y="124" width="208" height="208" rx="10" fill="#FFFFFF" opacity="0.10"/>
    <!-- ink strokes (hand-written look) -->
    <g stroke="#1E2230" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.92">
      <path d="M 150 186 C 190 172 246 174 306 186"/>
      <path d="M 150 222 C 186 210 236 212 308 222"/>
      <path d="M 150 258 C 196 248 244 250 300 262"/>
    </g>
    <!-- pin -->
    <circle cx="228" cy="124" r="16" fill="#EF4444"/>
    <circle cx="222" cy="118" r="5" fill="#FCA5A5"/>
  </g>
</svg>
