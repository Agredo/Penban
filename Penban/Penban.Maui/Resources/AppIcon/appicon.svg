<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Penban app icon background. Full-bleed on purpose: every platform masks the icon
     itself (Android adaptive icons, iOS rounded rect), so no rounded corners here. -->
<svg width="456" height="456" viewBox="0 0 456 456" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="456" y2="456" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#6366F1" />
            <stop offset="1" stop-color="#4338CA" />
        </linearGradient>
    </defs>
    <rect x="0" y="0" width="456" height="456" fill="url(#bg)" />
</svg>